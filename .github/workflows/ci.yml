name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  rust:
    name: Rust check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # Keep this list in step with the other workflows (release.yml, the e2e
          # job below): Tauri needs the GTK/WebKitGTK/AppIndicator dev headers and
          # `pkg-config`, `glib` is pulled in explicitly (some runner images no
          # longer ship it transitively), `patchelf` is used when bundling, and the
          # audio backend (flexaudio) needs the ALSA + PipeWire/SPA headers.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libasound2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libclang-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `tauri::generate_context!` embeds the frontend dist at compile time, so
      # build it before `cargo check`.
      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: cargo check
        working-directory: src-tauri
        run: cargo check

  e2e:
    name: E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # Same base as the `rust` job, plus the WebKitGTK WebDriver driver and
          # Xvfb (the runner is headless).
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libasound2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libclang-dev \
            webkit2gtk-driver \
            xvfb

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # `tauri build` runs the frontend build (beforeBuildCommand) and produces the
      # release binary the suite drives. `--no-bundle` skips packaging (not needed).
      - name: Build the app (release)
        run: npm run tauri build -- --no-bundle

      # The runners are headless, so GTK/WebKitGTK has no display server to
      # connect to and the app aborts on startup (`panic = "abort"` in the release
      # profile → SIGABRT before the embedded WebDriver server binds). Drive the
      # suite under Xvfb; `-a` picks a free display number for us.
      - name: Run the E2E suite (Xvfb)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a npm run test:e2e
        env:
          # WebKitGTK needs the DMABUF renderer off on Linux CI (no GPU).
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"

      - name: Run the E2E suite
        if: matrix.os != 'ubuntu-latest'
        run: npm run test:e2e

      - name: Upload the E2E report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.os }}
          path: e2e/artifacts
          if-no-files-found: ignore
