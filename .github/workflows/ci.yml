name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only is enough for checkout and for `dorny/paths-filter` to read the PR file
# list. No CI job writes anything back to the repository.
permissions:
  contents: read
  pull-requests: read

jobs:
  # A docs-only change should not spend the 3-OS build/test matrix. Keep this job
  # unconditional so the workflow still reports a result (a workflow-level
  # `paths-ignore` would leave required checks pending); the heavy jobs below skip.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'src-tauri/**'
              - 'e2e/**'
              - 'scripts/**'
              - 'public/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'tsconfig.node.json'
              - 'vite.config.ts'
              - 'index.html'
              - 'preview.html'
              - 'wdio.conf.ts'
              - 'screenshots.wdio.conf.ts'
              - 'eslint.config.js'
              - 'lint-staged.config.mjs'
              - '.prettierrc.json'
              - '.prettierignore'
              - '.jscpd.json'
              - 'knip.jsonc'
              - '.husky/**'
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The maid: the repo-wide invariants that keep the codebase navigable. Runs the
      # same npm scripts as `npm run maid` locally (the Rust half runs in the job below).
      - name: Format check (prettier)
        run: npm run maid:fmt

      - name: Lint (eslint, incl. Solid reactivity)
        run: npm run maid:lint

      - name: File-length budget
        run: npm run maid:size

      - name: Duplication (jscpd)
        run: npm run maid:dup

      - name: Dead code (knip)
        run: npm run maid:dead

  rust:
    name: Rust check (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # Keep this list in step with the other workflows (release.yml, the e2e
          # job below): Tauri needs the GTK/WebKitGTK/AppIndicator dev headers and
          # `pkg-config`, `glib` is pulled in explicitly (some runner images no
          # longer ship it transitively), `patchelf` is used when bundling, and the
          # audio backend (flexaudio) needs the ALSA + PipeWire/SPA headers.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libasound2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libclang-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `tauri::generate_context!` embeds the frontend dist at compile time, so
      # build it before `cargo check`.
      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Rust format + clippy
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      # `cargo test` also regenerates the ts-rs bindings into src/bindings, so this
      # doubles as the "did you regenerate the TypeScript after changing a boundary
      # type?" check (see docs/dependencies.md → Tooling notes). One OS is enough.
      - name: Rust tests + bindings in sync
        if: matrix.os == 'ubuntu-latest'
        working-directory: src-tauri
        run: |
          cargo test
          if [ -n "$(git --no-optional-locks status --porcelain -- ../src/bindings)" ]; then
            echo "::error::src/bindings is out of date — run 'cargo test' in src-tauri and commit the regenerated bindings"
            git --no-pager diff -- ../src/bindings
            exit 1
          fi

  e2e:
    name: E2E (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # Same base as the `rust` job, plus the WebKitGTK WebDriver driver and
          # Xvfb (the runner is headless).
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libasound2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libclang-dev \
            webkit2gtk-driver \
            xvfb

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # `tauri build` runs the frontend build (beforeBuildCommand) and produces the
      # release binary the suite drives. `--no-bundle` skips packaging (not needed).
      - name: Build the app (release)
        run: npm run tauri build -- --no-bundle

      # The runners are headless, so GTK/WebKitGTK has no display server to
      # connect to and the app aborts on startup (`panic = "abort"` in the release
      # profile → SIGABRT before the embedded WebDriver server binds). Drive the
      # suite under Xvfb; `-a` picks a free display number for us.
      - name: Run the E2E suite (Xvfb)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run -a npm run test:e2e
        env:
          # WebKitGTK needs the DMABUF renderer off on Linux CI (no GPU).
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"

      - name: Run the E2E suite
        if: matrix.os != 'ubuntu-latest'
        run: npm run test:e2e

      - name: Upload the E2E report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.os }}
          path: e2e/artifacts
          if-no-files-found: ignore
