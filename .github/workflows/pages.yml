name: Deploy landing page

# Intentionally no paths filter: docs/manual, the roadmap and ACKNOWLEDGEMENTS feed the
# generated landing, so a docs-only push to main must still rebuild and deploy it.
# Code-only pushes also run it (harmless), which keeps the release version current.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing through `actions/deploy-pages` needs to mint an OIDC token (id-token)
# and to write the published artifact (pages). Nothing else in the repo is touched.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running deploy finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build landing/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/configure-pages@v5

      # Astro reads the manual, roadmap and acknowledgements straight from the repo,
      # copies the manual screenshots into `landing/public/manual-assets/` and reads
      # the release version from package.json. There is no checked-in build output.
      - name: Build the landing
        run: npm run build:landing

      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
