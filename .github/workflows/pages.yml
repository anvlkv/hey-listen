name: Deploy marketing page

# Intentionally no paths filter: docs/ and ACKNOWLEDGEMENTS feed the generated site,
# so a docs-only push to main must still rebuild and deploy it. Code-only pushes also
# run it (harmless), which keeps the version stamp current when package.json changes.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing through `actions/deploy-pages` needs to mint an OIDC token (id-token)
# and to write the published artifact (pages). Nothing else in the repo is touched.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running deploy finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Regenerate the documentation subpages (acknowledgements + roadmap) from the
      # repo's markdown sources, and stamp the release version (from package.json) into
      # the hand-authored page, so the published site never drifts from the repo.
      - name: Build the site (doc subpages + version)
        run: node scripts/buildSite.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
