name: Deploy marketing page

on:
  push:
    branches: [main]
  workflow_dispatch:

# `peaceiris/actions-gh-pages` pushes the built site to the `gh-pages` branch,
# which needs write access to the repository contents.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish site/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Regenerate the documentation subpages (acknowledgements + roadmap) from the
      # repo's markdown sources, so the published pages never drift.
      - name: Build documentation subpages
        run: node scripts/buildSite.mjs

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          commit_message: "Publish marketing page from ${{ github.sha }}"
