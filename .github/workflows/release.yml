name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Bundle (${{ matrix.os }} ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          # Ubuntu 24.04 for the Linux bundle: flexaudio's Linux backend pulls
          # pipewire-rs 0.10, whose `libspa`/`libspa-sys` are written against the
          # PipeWire **0.3.65+** headers (0.3.65 is the crate's baseline feature) —
          # 22.04 ships 0.3.48, where `libspa` fails to compile. See `docs/packaging.md`.
          - os: ubuntu-24.04
            target: ""
            args: ""
          - os: windows-latest
            target: ""
            args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          # Keep this list in step with ci.yml: Tauri needs the GTK/WebKitGTK/
          # AppIndicator dev headers and `pkg-config`; the audio backend
          # (flexaudio) needs the ALSA + PipeWire/SPA headers.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libasound2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libclang-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (M33.C, ADR-30). `bundle.createUpdaterArtifacts` makes each
          # build emit its updater bundle + `.sig`; these two secrets sign them, and
          # tauri-action uploads the artifacts and publishes the `latest.json` feed the
          # app's `plugins.updater.endpoints` reads. The private key is never in the repo —
          # `npm run setup:updater` (scripts/setup-updater.mjs) generates the pair, injects
          # the public key into `tauri.conf.json` and registers the secrets. The password is
          # optional: it exists only when the private key was generated encrypted.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Only releases create updater artifacts. `createUpdaterArtifacts` is NOT in
          # `tauri.conf.json` — if it were, every local/CI `tauri build` (e.g. the E2E
          # suite) would demand a signing key. Enabled here, where the secrets exist.
          TAURI_CONFIG: '{"bundle":{"createUpdaterArtifacts":true}}'
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Hey Listen v__VERSION__"
          releaseBody: "Download the bundle for your platform below."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
