[package]
name = "hey-listen"
version = "0.1.0"
description = "Hey Listen — audio analysis workbench: capture, filter, and analyze audio."
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hey_listen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"     # native open/save dialogs (file source)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
postcard = { version = "1", features = ["use-std"] }

# Audio I/O and processing
flexaudio = "0.3"                                    # capture: mic / system / process / mix
symphonia = { version = "0.6", features = ["all"] }  # decode audio files (demux + decode)
fundsp = "0.23"                                      # audio nets: filtering and synthesis
oxiaudio = { version = "0.2", features = ["serde"] } # analysis
cpal = "0.16"                                        # preview playback (Output; flexaudio already pulls it in)

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The audio/DSP crates are heavy numeric code; optimize them even in the dev
# profile so analysis stays interactive (the app crate keeps the fast incremental
# dev build). Without this, long-window spectral/pitch tools take tens of seconds.
[profile.dev.package.oxiaudio-dsp]
opt-level = 3

[profile.dev.package.oxiaudio-core]
opt-level = 3

[profile.dev.package.oxifft]
opt-level = 3
